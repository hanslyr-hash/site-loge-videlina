{% extends "base_member.html" %}

{% block title %}
Modifier le document
{% endblock %}

{% block content %}

<div class="container">

    <h1>Modifier le document</h1>

    <form
        method="POST"
        action="{{ url_for('edit_document', document_id=document.id) }}"
    >

        <div class="form-group">

            <label for="title">
                Titre
            </label>

            <input
                type="text"
                id="title"
                name="title"
                value="{{ document.title }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="category">
                Catégorie
            </label>

            <input
                type="text"
                id="category"
                name="category"
                value="{{ document.category }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="reference">
                Référence / lien
            </label>

            <input
                type="text"
                id="reference"
                name="reference"
                value="{{ document.reference }}"
                required
            >

        </div>


        <div class="form-actions">

            <button
                type="submit"
                class="btn btn-primary"
            >
                💾 Enregistrer les modifications
            </button>

            <a
                href="{{ url_for('manage_documents') }}"
                class="btn btn-secondary"
            >
                Annuler
            </a>

        </div>

    </form>

</div>

{% endblock %}
